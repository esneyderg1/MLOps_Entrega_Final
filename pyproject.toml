[project]
name = "proyecto-final"
version = "0.1.0"
description = "Proyecto final MLOps: pipeline de ML orquestado con Prefect y trackeado con MLflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "mlflow>=3.15.2",
    "numpy>=2.3.2",
    "optuna>=4.4.0",
    "pandas>=2.3.1",
    "prefect>=3.4.12",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
